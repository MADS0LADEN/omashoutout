name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Linux binaries
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o build/omashoutout-linux-amd64 ./cmd/omashoutout
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o build/omashoutout-linux-arm64 ./cmd/omashoutout
      - uses: actions/upload-artifact@v4
        with:
          name: omashoutout-linux
          path: |
            build/omashoutout-linux-*
            licenses/
